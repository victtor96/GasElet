name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: client/dist
          if-no-files-found: error

  backend-build:
    name: Backend Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install backend dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            g++ \
            pkg-config \
            libssl-dev \
            libjsoncpp-dev \
            libcrypt-dev \
            uuid-dev \
            libz-dev \
            default-libmysqlclient-dev \
            libdrogon-dev

      - name: Configure CMake
        run: cmake -S server -B server/build-ci -G Ninja -DCMAKE_BUILD_TYPE=Release -Wno-dev

      - name: Build backend
        run: cmake --build server/build-ci --parallel

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-binary
          path: server/build-ci/drogon-react-ws
          if-no-files-found: error
